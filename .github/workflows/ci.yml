name: ci

on:
  push:
    branches: [main, dev, beta]
  pull_request:
    branches: [main, dev, beta]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the python bits
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-markdown python3-pygments python3-yaml
      - name: Builder tests
        run: |
          for t in tests/*.test.js; do node "$t"; done
      - name: Check the JS parses
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build the site
        run: python3 build.py --out dist --strict
